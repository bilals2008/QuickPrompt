name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--bundles nsis'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            args: '--bundles dmg app'
          - os: macos-15
            target: aarch64-apple-darwin
            args: '--bundles dmg app'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: '--bundles appimage deb'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file

      - run: npm ci
      - run: npm run build

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.6

      - name: Build bundles
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build ${{ matrix.args }}

      # Both macOS targets emit the same `QuickPrompt.app.tar.gz`, which would
      # overwrite each other when artifacts are merged. Give each its arch.
      - name: Name macOS updater archive by target
        if: runner.os == 'macOS'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd src-tauri/target/release/bundle/macos
          if [ -f QuickPrompt.app.tar.gz ]; then
            mv QuickPrompt.app.tar.gz "QuickPrompt_${VERSION}_${{ matrix.target }}.app.tar.gz"
            mv QuickPrompt.app.tar.gz.sig "QuickPrompt_${VERSION}_${{ matrix.target }}.app.tar.gz.sig"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.exe.sig
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.msi.sig
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.app.tar.gz.sig
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.AppImage.sig
            src-tauri/target/release/bundle/**/*.deb

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate updater manifest
        run: node scripts/update-manifest.mjs "${{ github.ref_name }}" artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.exe.sig
            artifacts/**/*.msi
            artifacts/**/*.msi.sig
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
            artifacts/**/*.AppImage
            artifacts/**/*.AppImage.sig
            artifacts/**/*.deb
            artifacts/latest.json
