[package]
name = "quickprompt"
version = "2.6.0"
description = "A simple prompt manager - create, tag, and copy prompts instantly"
authors = ["Muhammad Bilal Hassan"]
edition = "2021"

[lib]
name = "quickprompt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
