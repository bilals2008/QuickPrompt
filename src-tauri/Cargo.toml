[package]
name = "quickprompt"
version = "2.6.0"
description = "A simple prompt manager - create, tag, and copy prompts instantly"
authors = ["Muhammad Bilal Hassan"]
edition = "2021"

[lib]
name = "quickprompt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = { version = "0.11.1", features = ["aes", "alloc", "getrandom"] }
base64 = "0.23.1"
chrono = "0.4.45"
keyring = "4.2.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
