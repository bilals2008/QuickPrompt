<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickPrompt</title>
    <style>
      .splash-init {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #03080a;
        z-index: 9999;
      }
      .splash-init-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      .splash-init-logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        animation: splashPulse 1.5s ease-in-out infinite;
      }
      .splash-init-loader {
        width: 120px;
        height: 3px;
        background: #122830;
        border-radius: 2px;
        overflow: hidden;
      }
      .splash-init-bar {
        width: 40%;
        height: 100%;
        background: #c8ff00;
        border-radius: 2px;
        animation: splashLoading 1.2s ease-in-out infinite;
      }
      @keyframes splashPulse {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes splashLoading {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(150%); }
        100% { transform: translateX(-100%); }
      }
    </style>
  </head>
  <body>
    <div id="splash" class="splash-init">
      <div class="splash-init-content">
        <img src="/icon.png" alt="QuickPrompt" class="splash-init-logo" />
        <div class="splash-init-loader">
          <div class="splash-init-bar"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
